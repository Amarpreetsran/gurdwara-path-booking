<!doctype html>
<html lang="pa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monthly Report</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B2A5C">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Paaji+2:wght@500;700;800&family=Mukta+Mahee:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
  .sheet{max-width:820px;margin:24px auto;background:#fff;color:#16213E;border:1px solid #DDE1EC;border-radius:14px;padding:28px 28px 22px}
  .sheet table.roster{width:100%;border-collapse:collapse;margin-top:14px}
  .sheet table.roster th,.sheet table.roster td{border:1px solid #C9CFDD;padding:6px 8px;font-size:14px;text-align:left}
  .sheet table.roster td:last-child{width:28%}
  .sheet .top{display:flex;gap:14px;align-items:center;border-bottom:2px solid #1B2A5C;padding-bottom:12px}
  .sheet .om{font-family:var(--display);font-size:42px;color:#E3870E;line-height:1}
  .sheet h1{font-family:var(--display);font-size:24px;margin:0;line-height:1.15}
  .sheet .addr{font-size:13px;color:#5B6480}
  .sheet .title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:14px 0 10px}
  .sheet .title b{font-family:var(--display);font-size:20px}
  .sheet table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  .sheet td{padding:7px 0;border-bottom:1px solid #EEF0F5;vertical-align:top}
  .sheet td:first-child{color:#5B6480;width:42%;padding-right:12px}
  .sheet .amt{font-family:var(--display);font-size:26px}
  .sheet .en{font-size:.8em;color:#7A829C}
  .sheet .foot{margin-top:14px;font-size:12px;color:#5B6480}
  .sheet .stamp{display:inline-block;border:2px solid #1F7A4D;color:#1F7A4D;border-radius:8px;padding:2px 10px;font-weight:700;transform:rotate(-3deg)}
  .tools{max-width:820px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap}
  .allpage{margin-bottom:24px}
  .voidmark{border:3px solid #B3261E;color:#B3261E;border-radius:10px;padding:8px 12px;margin:10px 0;text-align:center;transform:rotate(-1.5deg)}
  .voidmark b{font-size:22px;letter-spacing:.06em}
  @media print{ .tools,header{display:none!important} body{background:#fff} .sheet{border:0;margin:0;max-width:none} .allpage{break-after:page;page-break-after:always} .allpage:last-child{break-after:auto} }
  .sheet h3{font-family:var(--display);font-size:17px;margin:18px 0 6px;border-bottom:1px solid #DDE1EC;padding-bottom:4px}
  .sheet table.list th,.sheet table.list td{border-bottom:1px solid #EEF0F5;padding:5px 6px;font-size:12.5px;text-align:left;width:auto;color:#16213E}
  .sheet table.list th{color:#5B6480;font-weight:600}
  .sheet table.list td.n,.sheet table.list th.n{text-align:right}
  .sheet td.n{text-align:right}
  .sheet tr.total td{font-weight:700;border-top:2px solid #1B2A5C}
  .sheet .void{text-decoration:line-through;color:#B3261E}
  .sign{display:flex;justify-content:space-between;gap:20px;margin-top:36px;font-size:13px;color:#5B6480;flex-wrap:wrap}
</style>
</head>
<body>
<main><div class="wrap" style="display:block;padding-block:16px 32px">
  <div class="tools"><button class="btn" id="printBtn" type="button">ਪ੍ਰਿੰਟ ਜਾਂ PDF ਸੇਵ ਕਰੋ · Print or save as PDF</button><a class="btn ghost" href="admin.html">Committee page</a></div>
  <div class="sheet" id="sheet"><p>Loading… (sign in on the committee page first)</p></div>
</div></main>
<script src="firebase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/data.js"></script>
<script>
(function(){
  const G=GPB,API=GPB_API,$=id=>document.getElementById(id),M$=G.money,esc=G.esc;
  const m=(new URLSearchParams(location.search).get('m')||G.today.slice(0,7)).slice(0,7);
  const label=(()=>{const [y,mm]=m.split('-').map(Number);return new Date(y,mm-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'})})();
  document.title='Monthly report '+label;
  $('printBtn').onclick=()=>window.print();
  let settings=null,data=null,tm=0;
  const row=(a,b,cls)=>`<tr${cls?` class="${cls}"`:''}><td>${a}</td><td class="n">${b}</td></tr>`;
  function draw(){
    if(!settings||!data)return;const o=G.monthData(data,m);
    $('sheet').innerHTML=`<div class="top"><div class="om">ੴ</div><div><h1>${esc(settings.name)}</h1><div class="addr">${esc(settings.address||'')}${settings.phone?' · '+esc(settings.phone):''}</div></div></div>
      <div class="title"><b>ਮਹੀਨਾਵਾਰ ਰਿਪੋਰਟ · Monthly report</b><span>${esc(label)}</span></div>
      <h3>ਪਾਠ · Paths with bhog this month</h3>
      <table>${row('Total',o.paths.length)}${Object.entries(o.byType).map(([k,n])=>row('&nbsp;&nbsp;'+esc((G.typeOf(k)||{}).en||k),n)).join('')}${row('Bookings cancelled this month',o.cancelled)}</table>
      <h3>ਪ੍ਰਾਪਤ ਭੇਟਾ · Received</h3>
      <table>${row('Path bheta, online (UPI)',M$(o.online))}${row('Path bheta, at the gurdwara',M$(o.office))}${row('Seva bheta with paths',M$(o.seva))}${row('Seva bheta without booking',M$(o.sevaOnly))}
        ${row('Total received',M$(o.received),'total')}${row('Refunds given',M$(o.refunds))}</table>
      <h3>ਖ਼ਰਚ · Paid out</h3>
      <table>${Object.entries(o.expenses).map(([k,v])=>row(esc(k),M$(v))).join('')||row('No payments','—')}${row('Total paid out',M$(o.expTotal),'total')}</table>
      <h3>ਬਾਕੀ · Balance</h3>
      <table>${row('Received − refunds − paid out',M$(o.net),'total')}</table>
      ${o.paths.length?`<h3>ਪਾਠਾਂ ਦਾ ਵੇਰਵਾ · Paths</h3><table class="list"><tr><th>Bhog</th><th>Path</th><th>Family</th><th>Ref</th><th class="n">Bheta</th><th class="n">Paid</th><th class="n">Balance</th><th>Pathi Singhs</th></tr>
        ${o.paths.map(x=>`<tr><td>${G.fmtShort(x.bhog)}</td><td>${esc((G.typeOf(x.l.type)||{}).en||x.l.type)}</td><td>${esc(x.l.name)}</td><td>${esc(x.ref)}</td><td class="n">${M$(x.a.total)}</td><td class="n">${M$(x.a.paid)}</td><td class="n">${x.a.due?M$(x.a.due):'—'}</td><td>${esc(x.pathis.join(', '))}</td></tr>`).join('')}</table>`:''}
      ${o.receipts.length?`<h3>ਰਸੀਦਾਂ · Receipts</h3><table class="list"><tr><th>No.</th><th>Type</th><th>Date</th><th>Name</th><th>Mode</th><th class="n">Amount</th></tr>
        ${o.receipts.map(r=>`<tr${r.void?' class="void"':''}><td>${esc(r.no)}</td><td>${esc(r.kind)}</td><td>${new Date(r.date).toLocaleDateString('en-IN')}</td><td>${esc(r.name)}</td><td>${esc(r.method)}</td><td class="n">${r.kind==='Refund'?'−':''}${M$(r.amount)}${r.void?' VOID':''}</td></tr>`).join('')}</table>`:''}
      ${o.vouchers.length?`<h3>ਭੁਗਤਾਨ ਵਾਊਚਰ · Payment vouchers</h3><table class="list"><tr><th>No.</th><th>Date</th><th>Type</th><th>Paid to</th><th>Mode</th><th class="n">Amount</th></tr>
        ${o.vouchers.map(e=>`<tr${e.void?' class="void"':''}><td>${esc(e.no)}</td><td>${new Date(e.date).toLocaleDateString('en-IN')}</td><td>${esc(e.category)}</td><td>${esc(e.name)}</td><td>${esc(e.method)}</td><td class="n">${M$(e.amount)}${e.void?' VOID':''}</td></tr>`).join('')}</table>`:''}
      <div class="sign"><span>ਖ਼ਜ਼ਾਨਚੀ / Khazanchi: ____________________</span><span>ਪ੍ਰਧਾਨ / Pardhan: ____________________</span></div>
      <div class="foot">Made ${new Date().toLocaleString('en-IN')} from the booking records. VOID receipts and vouchers are listed but not counted.</div>`;
  }
  API.watchSettings(s=>{settings=s;draw()});
  API.onAuth((u,ok,role)=>{if(!u||!ok||!G.roleAtLeast(role,'treasurer')){$('sheet').innerHTML='<p>Only the Khazanchi or Pardhan can open this report. Sign in on the committee page in this browser, then open it again.</p>';return}
    API.watchAdmin(d=>{data=d;clearTimeout(tm);tm=setTimeout(draw,700)})});
})();
</script>
</body>
</html>
